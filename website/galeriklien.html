<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galeri foto klien." />
    <title id="client-title">Galeri — Shortir File</title>
    <link rel="icon" type="image/png" sizes="256x256" href="assets/shortir_file_icon.png" />
    <link rel="apple-touch-icon" href="assets/shortir_file_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="client-page">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header" id="top">
      <span class="brand client-brand">
        <svg class="client-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span id="client-header-title">Galeri</span>
        <span class="client-session" id="client-session" hidden></span>
      </span>
      <a class="client-drive-link" id="client-drive-link" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Buka di Google Drive</span>
      </a>
    </header>

    <main>
      <section class="gallery-section section-shell">
        <div class="gallery-tools">
          <p class="gallery-note" id="gallery-note">Memuat galeri…</p>
          <input class="client-search" id="client-search" type="text" placeholder="Cari nama file…" autocomplete="off" />
        </div>

        <div class="select-toolbar client-pill" id="select-toolbar" hidden>
          <span class="client-pill-icon">⏳</span>
          <span id="client-expiry-text"></span>
          <span class="client-pill-divider" id="client-pill-divider" hidden></span>
          <span id="select-count">0 foto dipilih</span>
          <span class="sheet-chevron">▲</span>
        </div>

        <div class="select-panel" id="select-panel" hidden>
          <div class="select-panel-head">
            <span id="select-panel-count"></span>
            <div class="select-actions">
              <button class="button button-small button-accent" id="select-download" type="button">Download <span>↓</span></button>
              <button class="button button-small button-dark" id="send-selected" type="button">Kirim Foto Terpilih <span>↗</span></button>
              <button class="button button-small button-ghost" id="select-panel-clear" type="button">Bersihkan</button>
            </div>
          </div>
          <p class="gallery-note" id="send-status"></p>
          <div class="select-panel-grid" id="select-panel-grid"></div>
        </div>

        <div class="gallery-frame-wrap" id="gallery-frame-wrap" hidden>
          <div class="gallery-grid" id="gallery-grid"></div>
          <div class="drive-embed" id="drive-embed" hidden></div>
          <button class="button button-dark load-more" id="load-more" type="button" hidden>Muat lebih banyak <span>↓</span></button>
        </div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <div class="footer-bottom">
        <span>© <span id="year"></span> Shortir File</span>
        <span>Made for calmer workspaces.</span>
      </div>
    </footer>

    <div class="pin-gate" id="pin-gate" hidden>
      <div class="pin-gate-panel">
        <h3>Galeri terkunci</h3>
        <p>Masukkan PIN untuk melihat foto galeri ini.</p>
        <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 4–6 digit" aria-label="PIN galeri" autocomplete="off" />
        <button class="button button-dark" id="pin-submit" type="button">Buka galeri</button>
        <p class="key-note" id="pin-note"></p>
      </div>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Tutup">&times;</button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Sebelumnya">‹</button>
      <figure class="lightbox-figure">
        <img id="lightbox-img" src="" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
        <button class="lightbox-fav" id="lightbox-fav" type="button">♡ Pilih foto</button>
      </figure>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Berikutnya">›</button>
    </div>

    <script src="vendor/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    <script>
      (() => {
        const qp = new URLSearchParams(window.location.search);
        const title = qp.get('name');
        if (title) {
          document.title = `${title} — Galeri — Shortir File`;
          const headerTitle = document.querySelector('#client-header-title');
          if (headerTitle) headerTitle.textContent = title;
        }
        const sessionEl = document.querySelector('#client-session');
        const sessionTime = qp.get('jam');
        if (sessionTime && sessionEl) {
          sessionEl.textContent = `• jam ${sessionTime}`;
          sessionEl.hidden = false;
        }
        const driveLink = document.querySelector('#client-drive-link');
        const driveUrl = qp.get('url');
        if (driveUrl && driveLink) {
          driveLink.href = driveUrl;
          driveLink.hidden = false;
        }
        if (!qp.get('url')) {
          const note = document.querySelector('#gallery-note');
          if (note) note.textContent = 'Tautan galeri tidak valid.';
        }

        const pill = document.querySelector('#select-toolbar');
        const expiryText = document.querySelector('#client-expiry-text');
        const expiryDivider = document.querySelector('#client-pill-divider');
        const untilDate = qp.get('until');
        if (untilDate && pill) {
          const expiryEnd = new Date(`${untilDate}T23:59:59`).getTime();
          window.__shortirExpiryActive = true;
          pill.hidden = false;
          if (expiryDivider) expiryDivider.hidden = false;
          const formatRemaining = () => {
            const diff = expiryEnd - Date.now();
            if (diff <= 0) {
              expiryText.textContent = 'Galeri telah berakhir.';
              return;
            }
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            let text = '';
            if (days > 0) text += `${days} hari `;
            text += `${hours} jam ${mins} menit`;
            expiryText.textContent = text;
          };
          formatRemaining();
          setInterval(formatRemaining, 30000);
        }

        const galleryId = qp.get('gal') || '';
        const sendBtn = document.querySelector('#send-selected');
        const sendStatus = document.querySelector('#send-status');

        const sheetTrigger = document.querySelector('#select-toolbar');
        const sheet = document.querySelector('#select-panel');
        function positionPill() {
          if (!sheet.classList.contains('sheet-open')) {
            sheetTrigger.style.bottom = '';
            return;
          }
          const h = sheet.offsetHeight;
          sheetTrigger.style.bottom = `${h + 14}px`;
        }
        function toggleSheet(open) {
          if (open === undefined) open = !sheet.classList.contains('sheet-open');
          sheet.classList.toggle('sheet-open', open);
          sheetTrigger.classList.toggle('open', open);
          sheetTrigger.querySelector('.sheet-chevron').textContent = open ? '▼' : '▲';
          if (open) requestAnimationFrame(positionPill);
          else sheetTrigger.style.bottom = '';
        }
        sheetTrigger?.addEventListener('click', () => toggleSheet());
        window.addEventListener('resize', positionPill);
        document.addEventListener('click', (event) => {
          if (!sheet || !sheet.classList.contains('sheet-open')) return;
          if (!event.target.closest('#select-panel') && !event.target.closest('#select-toolbar')) {
            toggleSheet(false);
          }
        });

        if (!galleryId || !window.supabase || !sendBtn) {
          sendBtn?.remove();
        } else {
          sendBtn.addEventListener('click', async () => {
            const files = (window.shortirGetSelected?.() || []).map((f) => ({ id: f.id, name: f.name }));
            if (!files.length) {
              sendStatus.textContent = 'Pilih dulu minimal satu foto.';
              return;
            }
            sendBtn.disabled = true;
            sendStatus.textContent = 'Mengirim…';
            try {
              const response = await fetch(`${window.SUPABASE_URL}/functions/v1/submit-gallery`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gallery_id: galleryId, client_name: '', files }),
              });
              const result = await response.json();
              if (!response.ok) throw new Error(result.error || 'Gagal mengirim');
              sendStatus.textContent = `Terkirim! ${files.length} foto terkirim ke pemilik galeri.`;
            } catch (err) {
              sendStatus.textContent = `Gagal mengirim: ${err.message}`;
            } finally {
              sendBtn.disabled = false;
            }
          });
        }
      })();
    </script>
  </body>
</html>
