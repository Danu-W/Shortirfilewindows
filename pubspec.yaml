name: shortir_file
description: Shortir File cross-platform file organizer for photos and documents.
publish_to: none
version: 1.2.2+7

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.2.0
  crypto: ^3.0.8
  desktop_drop: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  file_picker_darwin:
    path: macos/Plugins/file_picker_darwin

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/shortir_file_icon.png
